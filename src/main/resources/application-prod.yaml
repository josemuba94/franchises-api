spring:
  datasource:
    url: ${POSTGRES_URL} #jdbc:postgresql://3.142.136.222:5432/postgres
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME} #postgres
    password: ${POSTGRES_PASSWORD} #password
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
